# ============================================
# ChatJu Premium - AWS Lambda Deployment
# ============================================
# Deploy backend Express.js app to AWS Lambda using Serverless Framework
#
# Prerequisites:
# 1. Install Serverless Framework: npm install -g serverless
# 2. Configure AWS credentials: serverless config credentials --provider aws --key YOUR_KEY --secret YOUR_SECRET
# 3. Install dependencies: npm install
#
# Deployment:
# - Development: serverless deploy --stage dev
# - Production: serverless deploy --stage prod
#
# Remove deployment:
# - serverless remove --stage prod

service: chatju-premium-backend

# Framework version constraint
frameworkVersion: '3 || 4'

# Load backend/.env into ${env:*} resolution. Framework-native dotenv is used
# instead of relying on serverless-dotenv-plugin, whose values are populated
# too late for v3 variable resolution (SUPABASE_URL/ANON_KEY would error).
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-northeast-2'} # Seoul region (Korea)
  memorySize: 1024 # MB - 1024 needed for CJK font rendering in PDF
  timeout: 60 # seconds - AI generation + PDF + email can take 40-50s
  httpApi:
    cors:
      allowedOrigins:
        - https://somyung.cc
        - https://somyung.pages.dev
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true

  # Environment variables (CRITICAL: Set these in AWS Console or use .env)
  environment:
    NODE_ENV: production
    AI_PROVIDER: ${env:AI_PROVIDER, 'openai'}

    # AI Provider API Keys (set at least one)
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    OPENAI: ${env:OPENAI, ''}
    OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-5.4-nano'}
    OPENAI_FALLBACK_MODEL: ${env:OPENAI_FALLBACK_MODEL, 'gpt-5.4-mini'}
    GEMINI_MODEL: ${env:GEMINI_MODEL, 'gemini-3-flash-preview'}
    CLAUDE_MODEL: ${env:CLAUDE_MODEL, 'claude-sonnet-4-6'}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}

    # Supabase Configuration
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_ANON_KEY: ${env:SUPABASE_ANON_KEY}
    # Code reads SUPABASE_SERVICE_KEY; also expose the *_ROLE_KEY alias.
    SUPABASE_SERVICE_KEY: ${env:SUPABASE_SERVICE_KEY, ''}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_KEY, ''}

    # Frontend origin (used for links/CORS in app code)
    FRONTEND_URL: ${env:FRONTEND_URL, ''}

    # Payment Gateway API Keys (optional - using Paddle)
    TOSS_SECRET_KEY: ${env:TOSS_SECRET_KEY, ''}
    TOSS_CLIENT_KEY: ${env:TOSS_CLIENT_KEY, ''}
    PAYPAL_CLIENT_ID: ${env:PAYPAL_CLIENT_ID, ''}
    PAYPAL_CLIENT_SECRET: ${env:PAYPAL_CLIENT_SECRET, ''}
    # Live vs sandbox base URL (e.g. https://api-m.paypal.com). Without this the
    # backend may default to the wrong PayPal environment.
    PAYPAL_API_BASE_URL: ${env:PAYPAL_API_BASE_URL, ''}
    # Webhook ID from PayPal Developer Dashboard. Empty = webhooks rejected
    # (fail-closed); the synchronous capture flow is unaffected. Set post-launch.
    PAYPAL_WEBHOOK_ID: ${env:PAYPAL_WEBHOOK_ID, ''}
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY, ''}
    STRIPE_PUBLISHABLE_KEY: ${env:STRIPE_PUBLISHABLE_KEY, ''}

    # Paddle Configuration (primary payment)
    PADDLE_API_KEY: ${env:PADDLE_API_KEY, ''}
    PADDLE_WEBHOOK_SECRET: ${env:PADDLE_WEBHOOK_SECRET, ''}
    PADDLE_ENVIRONMENT: ${env:PADDLE_ENVIRONMENT, 'sandbox'}

    # Email Service (Resend)
    RESEND_API_KEY: ${env:RESEND_API_KEY, ''}

    # Signed report/payment access tokens
    ACCESS_TOKEN_SECRET: ${env:ACCESS_TOKEN_SECRET, ''}

    # Admin allowlist (comma-separated Supabase user IDs). Empty = admin routes
    # deny everyone (safe default). Set to your user ID to use the admin panel.
    ADMIN_USER_IDS: ${env:ADMIN_USER_IDS, ''}

    # CORS Configuration (production only allows production domain)
    CORS_ORIGIN: https://somyung.cc

  # IAM Role Statements (permissions for Lambda)
  iam:
    role:
      statements:
        # CloudWatch Logs (for logging)
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: 'arn:aws:logs:*:*:*'

# ============================================
# Functions (Lambda handlers)
# ============================================
functions:
  api:
    handler: index.handler
    description: ChatJu Premium Backend API
    # Cap public Function URL scale while preserving headroom above the
    # observed 30-day peak concurrency of 2.
    reservedConcurrency: 5
    url: true
    events:
      # HTTP API Gateway - handles all routes
      - httpApi:
          path: /{proxy+}
          method: ANY

      # Root path
      - httpApi:
          path: /
          method: ANY

# ============================================
# Plugins
# ============================================
plugins:
  # .env is loaded via top-level `useDotenv: true` (Framework-native), so the
  # serverless-dotenv-plugin is intentionally not listed (it conflicts with it).
  - serverless-offline # For local testing: serverless offline

# ============================================
# Package Configuration
# ============================================
package:
  patterns:
    # Include
    - 'index.js'
    - 'src/**'
    - 'assets/**'
    - 'node_modules/**'
    - 'package.json'

    # Exclude (reduce package size)
    - '!assets/fonts/*.otf'
    - '!.git/**'
    - '!.env*'
    - '!.gitignore'
    - '!README.md'
    - '!test/**'
    - '!*.test.js'
    - '!coverage/**'
    - '!docs/**'

# ============================================
# Custom Configuration
# ============================================
custom:
  # Serverless Offline Plugin (for local testing)
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0

# ============================================
# Resources (CloudFormation)
# ============================================
resources:
  # Extend Serverless's generated HTTP API $default stage with actual
  # API Gateway throttling. The former custom.apiGatewayThrottling key was inert.
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          DetailedMetricsEnabled: false
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  Resources:
    # CloudWatch Log Group (30 day retention)
    ApiLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:provider.stage}-api
        RetentionInDays: 30

  # Outputs (display after deployment)
  Outputs:
    ApiUrl:
      Description: 'API Gateway endpoint URL'
      Value:
        Fn::Sub: 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'

    ApiId:
      Description: 'API Gateway ID'
      Value:
        Ref: HttpApi

    FunctionArn:
      Description: 'Lambda Function ARN'
      Value:
        Fn::GetAtt: [ApiLambdaFunction, Arn]

# ============================================
# DEPLOYMENT GUIDE
# ============================================
#
# 1. Install Serverless Framework:
#    npm install -g serverless
#
# 2. Configure AWS credentials:
#    serverless config credentials --provider aws --key YOUR_ACCESS_KEY --secret YOUR_SECRET_KEY
#
# 3. Install serverless-offline plugin (optional, for local testing):
#    npm install --save-dev serverless-offline
#
# 4. Set environment variables:
#    - Option A: Create .env file in backend/ directory
#    - Option B: Set in AWS Lambda Console after deployment
#    - Option C: Use AWS Systems Manager Parameter Store
#
#    Required variables:
#    - SUPABASE_URL
#    - SUPABASE_ANON_KEY
#    - SUPABASE_SERVICE_ROLE_KEY
#    - At least one AI provider key (OPENAI_API_KEY or OPENAI recommended)
#    - TOSS_SECRET_KEY (for Korean payments)
#    - PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET (for international payments)
#
# 5. Deploy to AWS:
#    cd backend
#    serverless deploy --stage prod
#
# 6. After deployment:
#    - Copy the API Gateway URL from output
#    - Update frontend/.env.production with NEXT_PUBLIC_API_URL=<YOUR_API_URL>
#    - Redeploy frontend to Cloudflare Pages
#
# 7. Test deployment:
#    curl https://YOUR_API_URL.execute-api.ap-northeast-2.amazonaws.com/
#
# 8. View logs:
#    serverless logs -f api --stage prod --tail
#
# 9. Remove deployment (if needed):
#    serverless remove --stage prod
#
# ============================================
# COST ESTIMATION (AWS Free Tier)
# ============================================
#
# Lambda:
# - 1M requests/month FREE
# - 400,000 GB-seconds compute FREE
# - Typical ChatJu usage: ~10K-50K requests/month = FREE
#
# API Gateway:
# - First 12 months: 1M requests FREE
# - After: $1.00 per million requests
#
# CloudWatch Logs:
# - 5GB ingestion FREE
# - Typical usage: ~1-2GB/month = FREE
#
# TOTAL ESTIMATED COST: $0-5/month (within free tier for most startups)
#
# ============================================
