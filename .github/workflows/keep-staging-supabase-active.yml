name: Keep staging Supabase active

on:
  schedule:
    # 02:17, 10:17, and 18:17 Asia/Seoul (UTC+9)
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Read one staging user identifier
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --write-out 'staging read status=%{http_code}\n' \
            "${STAGING_SUPABASE_URL}/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${STAGING_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ANON_KEY}"
